<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Ledger" />
    <meta name="description" content="Track weight, food and water. Private, offline, on-device." />
    <title>Ledger</title>
    <script>
      // Apply saved theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem('ledger-theme');
        if (t === 'light') document.documentElement.classList.remove('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Last-resort message if the app's JavaScript never starts (instead of a blank screen).
      (function () {
        var errs = [];
        window.addEventListener('error', function (e) { errs.push(e.message || (e.target && e.target.src) || 'load error'); }, true);
        window.addEventListener('unhandledrejection', function (e) { errs.push(String(e.reason)); });
        setTimeout(function () {
          var root = document.getElementById('root');
          if (!root || root.childElementCount) return;
          root.innerHTML =
            '<div style="font:16px -apple-system,system-ui,sans-serif;color:#f5f5fa;padding:calc(env(safe-area-inset-top) + 48px) 24px 24px;max-width:480px;margin:0 auto">' +
            '<p style="font-size:22px;font-weight:700;margin:0 0 8px">Ledger couldn\u2019t start</p>' +
            '<p style="color:#8e8e9e;margin:0 0 16px">The app files didn\u2019t load. Check your connection and reload. If this keeps happening, send a screenshot of this screen.</p>' +
            '<button onclick="location.reload()" style="font:600 16px -apple-system,system-ui;background:#f5f5fa;color:#0a0a0f;border:0;border-radius:14px;padding:12px 20px">Reload</button>' +
            '<pre style="white-space:pre-wrap;color:#8e8e9e;font-size:12px;margin-top:20px"></pre></div>';
          root.querySelector('pre').textContent = errs.join('\n') || location.href;
        }, 8000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
